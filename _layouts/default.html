<!DOCTYPE html>
<html lang="{{ page.lang | default: site.default_lang | default: 'ko' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    {% assign t = site.data.translations[page.lang] | default: site.data.translations.ko %}
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ t.site.title }}</title>
    <meta name="description" content="{{ page.description | default: t.site.description }}">

    <!-- Language alternates for SEO -->
    <link rel="alternate" hreflang="ko" href="{{ site.url }}{{ page.url }}" />
    <link rel="alternate" hreflang="en" href="{{ site.url }}/en{{ page.url }}" />
    <link rel="alternate" hreflang="x-default" href="{{ site.url }}{{ page.url }}" />

    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    {% seo %}
</head>
<body>
    {% include header.html %}

    <main class="main-content">
        {{ content }}
    </main>

    {% include footer.html %}

    <!-- Language detection script -->
    <script>
        (function() {
            // Only run on first visit to the site
            if (!sessionStorage.getItem('langDetected') && window.location.pathname === '/') {
                const browserLang = navigator.language || navigator.userLanguage;
                const isKorean = browserLang.startsWith('ko');

                // If browser language is not Korean, redirect to English version
                if (!isKorean) {
                    sessionStorage.setItem('langDetected', 'true');
                    window.location.href = '/en/';
                }
            }
        })();
    </script>
</body>
</html>
