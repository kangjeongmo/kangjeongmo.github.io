{% assign t = site.data.translations[page.lang] | default: site.data.translations.ko %}
{% assign current_lang = page.lang | default: 'ko' %}

<header class="site-header">
    <div class="container">
        <div class="header-content">
            <a href="{% if current_lang == 'en' %}/en/{% else %}/{% endif %}" class="site-title">
                {{ t.site.author_name }}
            </a>

            <nav class="site-nav">
                <input type="checkbox" id="nav-toggle" class="nav-toggle">
                <label for="nav-toggle" class="nav-toggle-label">
                    <span></span>
                </label>

                <ul class="nav-menu">
                    <li><a href="{% if current_lang == 'en' %}/en/{% else %}/{% endif %}" {% if page.url=='/' or page.url=='/en/' %}class="active" {% endif %}>{{ t.nav.home }}</a></li>
                    <li><a href="{% if current_lang == 'en' %}/en/projects{% else %}/projects{% endif %}" {% if page.url contains '/projects' %}class="active" {% endif %}>{{ t.nav.projects }}</a></li>
                    <li><a href="{% if current_lang == 'en' %}/en/contact{% else %}/contact{% endif %}" {% if page.url contains '/contact' %}class="active" {% endif %}>{{ t.nav.contact }}</a></li>
                    <li class="lang-switcher">
                        {% if current_lang == 'ko' %}
                        <a href="/en{{ page.url }}" class="lang-link">EN</a>
                        {% else %}
                        <a href="{{ page.url | remove: '/en' }}" class="lang-link">KO</a>
                        {% endif %}
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</header>
